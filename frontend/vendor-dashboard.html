<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kênh đối tác – Trạm Hỷ</title>
  <link rel="icon" href="assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://vsjdijmuvuetmhmszcrl.supabase.co" crossorigin>
  <link rel="modulepreload" href="js/vendor/supabase-2.117.3.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <script type="module" src="js/pages/vendor-dashboard.js?v=5"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="section-head">
      <div>
        <div class="eyebrow">Kênh đối tác</div>
        <h1 id="shop-name">Quản lý đơn &amp; Doanh thu</h1>
        <p>Đơn mới và thanh toán tự cập nhật theo thời gian thực · Tiệm thực nhận 90% giá trị đơn (Phí nền tảng Trạm Hỷ 10%).</p>
      </div>
      <div class="row" id="partner-finance-actions" hidden>
        <button class="btn btn-outline btn-sm" type="button" id="btn-partner-sync">🔄 Đồng bộ Google Sheets</button>
        <button class="btn btn-primary btn-sm" type="button" id="btn-partner-excel">⬇ Xuất Excel Doanh thu (.xlsx)</button>
      </div>
    </div>
    <div id="shop-status" class="stack" style="margin-bottom:20px"></div>
    <div id="workspace" hidden>
      <div id="checklist" style="margin-bottom:16px"></div>
      <div class="row" style="margin-bottom:16px">
        <div class="tabs">
          <button class="tab active" type="button" data-panel="orders">Đơn hàng</button>
          <button class="tab" type="button" data-panel="dresses" id="tab-dresses">Mẫu váy</button>
          <button class="tab" type="button" data-panel="media">Ảnh tiệm</button>
        </div>
        <select class="input" id="shop-select" hidden style="width:auto" aria-label="Chọn tiệm"></select>
      </div>
      <section id="panel-orders">
        <div class="grid" id="stats" style="margin-bottom:24px"></div>
        <div id="board"></div>
      </section>
      <section id="panel-dresses" hidden></section>
      <section id="panel-media" hidden></section>
    </div>
  </main>

  <footer id="app-footer"></footer>
</body>
</html>
