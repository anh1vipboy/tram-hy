<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị – Trạm Hỷ</title>
  <link rel="icon" href="assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://vsjdijmuvuetmhmszcrl.supabase.co" crossorigin>
  <link rel="modulepreload" href="js/vendor/supabase-2.117.3.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <script type="module" src="js/pages/admin.js?v=5"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="section-head">
      <div>
        <div class="eyebrow">Quản trị Trạm Hỷ</div>
        <h1>Dòng tiền Escrow, Hoa hồng (10%) &amp; Đối tác</h1>
        <p>Minh bạch 100% giá trị đơn hàng: Hoa hồng nền tảng 10% · Giải ngân đối tác 90% · Miễn phí 0đ cho Cô dâu Chú rể.</p>
      </div>
      <div class="row" id="admin-head-actions">
        <button class="btn btn-outline btn-sm" type="button" id="btn-live-sync">🔄 Đồng bộ Google Sheets / Excel</button>
        <button class="btn btn-primary btn-sm" type="button" id="btn-export-admin">⬇ Xuất Excel Đối soát (.xlsx)</button>
      </div>
    </div>
    <div class="grid" id="stats" style="margin-bottom:24px"></div>

    <div class="tabs" style="margin-bottom:16px">
      <button class="tab active" data-tab="approvals" type="button">Duyệt đối tác <span class="badge badge-gold" id="pending-count">0</span></button>
      <button class="tab" data-tab="disputes" type="button">Khiếu nại</button>
      <button class="tab" data-tab="vendors" type="button">Đối tác</button>
      <button class="tab" data-tab="bookings" type="button">Tất cả đơn</button>
      <button class="tab" data-tab="ai" type="button">Thử váy AI</button>
    </div>
    <section id="tab-approvals"></section>
    <section id="tab-disputes" hidden></section>
    <section id="tab-vendors" hidden></section>
    <section id="tab-bookings" hidden></section>
    <section id="tab-ai" hidden></section>
  </main>

  <footer id="app-footer"></footer>
</body>
</html>
