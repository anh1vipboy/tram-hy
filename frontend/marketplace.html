<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch vụ cưới – Trạm Hỷ</title>
  <link rel="icon" href="assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://vsjdijmuvuetmhmszcrl.supabase.co" crossorigin>
  <link rel="modulepreload" href="js/vendor/supabase-2.117.3.js">
  <link rel="modulepreload" href="js/core/layout.js">
  <link rel="modulepreload" href="js/core/supabase.js">
  <link rel="modulepreload" href="js/core/utils.js">
  <link rel="modulepreload" href="js/core/auth.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script type="module" src="js/pages/marketplace.js?v=3"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="section-head">
      <div>
        <div class="eyebrow">Dịch vụ cưới</div>
        <h1>Đối tác &amp; Mẫu dịch vụ được bảo chứng</h1>
        <p>Xem toàn bộ cửa hàng đối tác, các mẫu váy cưới và gói dịch vụ lẻ. Mọi đơn đặt đều giữ cọc an toàn 3 đợt qua Trạm Hỷ.</p>
      </div>
      <div class="tabs marketplace-tabs" id="view-tabs" role="tablist" aria-label="Chế độ xem">
        <button class="tab active" type="button" role="tab" data-view="vendors" aria-selected="true">Đối tác</button>
        <button class="tab" type="button" role="tab" data-view="dresses" aria-selected="false">Mẫu váy cưới</button>
        <button class="tab" type="button" role="tab" data-view="packages" aria-selected="false">Gói dịch vụ</button>
      </div>
    </div>

    <div class="card stack" style="margin-bottom:20px">
      <div class="chips" id="category-filter"></div>
      <div class="form-grid">
        <label class="field"><span>Tìm theo tên hoặc khu vực</span>
          <input class="input" id="search" type="search" placeholder="VD: Cầu Giấy, TuArt…"></label>
        <label class="field"><span>Sắp xếp</span>
          <select class="input" id="sort">
            <option value="rating">Đánh giá cao nhất</option>
            <option value="price-asc">Giá thấp → cao</option>
            <option value="price-desc">Giá cao → thấp</option>
          </select>
        </label>
        <div class="field"><span id="max-price-label">Ngân sách tối đa</span>
          <select class="input" id="max-price" aria-labelledby="max-price-label">
            <option value="">Không giới hạn</option>
            <option value="5000000">Dưới 5 triệu</option>
            <option value="20000000">Dưới 20 triệu</option>
            <option value="50000000">Dưới 50 triệu</option>
            <option value="150000000">Dưới 150 triệu</option>
            <option value="custom">Tự nhập số tiền…</option>
          </select>
          <div class="money-field" id="max-custom-wrap" hidden>
            <input class="input" id="max-custom" placeholder="VD: 30.000.000" aria-label="Nhập ngân sách tối đa (VNĐ)">
            <span class="suffix">đ</span>
          </div>
          <p class="field-error" id="max-error" hidden></p>
        </div>
        <label class="row" style="align-self:end">
          <input type="checkbox" id="verified-only"> Chỉ đối tác Tích Xanh ✓
        </label>
      </div>
    </div>

    <div class="result-bar" id="result-count"></div>
    <div class="grid" id="vendor-grid"><div class="empty">Đang tải đối tác…</div></div>
  </main>

  <footer id="app-footer"></footer>
</body>
</html>
