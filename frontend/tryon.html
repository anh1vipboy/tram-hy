<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Phòng thử váy AI – Trạm Hỷ</title>
  <link rel="icon" href="assets/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://vsjdijmuvuetmhmszcrl.supabase.co" crossorigin>
  <link rel="modulepreload" href="js/vendor/supabase-2.117.3.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tryon.css">
  <script type="module" src="js/pages/tryon.js"></script>
</head>
<body class="page-chat">
  <header id="app-header"></header>

  <!-- Phòng thử dạng trò chuyện: chọn ảnh + váy ở khung soạn tin, gửi → AI ướm váy, kết quả hiện ngay trong khung chat -->
  <main class="chat">
    <div class="chat-top">
      <img class="chat-top-logo" src="assets/images/logo.webp" alt="">
      <div class="chat-top-text">
        <h1>Phòng thử váy AI</h1>
        <p>Ướm váy cưới lên chính ảnh của bạn – giữ nguyên khuôn mặt, dáng người và khung cảnh.</p>
      </div>
      <a class="btn btn-outline btn-sm chat-top-link" href="thiet-ke-vay.html">✂️ Tự thiết kế váy</a>
    </div>

    <section class="chat-thread" id="chat-thread" aria-live="polite" aria-label="Trò chuyện với trợ lý thử váy">
      <div class="chat-loading" id="chat-loading"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>Đang mở phòng thử…</div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box">
        <div class="composer-slots" id="composer-slots"></div>
        <textarea id="composer-text" rows="1" maxlength="400" aria-label="Tin nhắn cho trợ lý thử váy"
                  placeholder="Nhắn cho trợ lý… VD: ướm váy này cho mình, tà váy dài chạm đất"></textarea>
        <div class="composer-bar">
          <button type="button" class="composer-settings" id="open-settings" aria-label="Tùy chỉnh ướm thử">
            <span aria-hidden="true">⚙️</span><span id="settings-sum">Tùy chỉnh</span>
          </button>
          <span class="composer-cost" id="composer-cost"></span>
          <button type="submit" class="composer-send" id="send-btn" aria-label="Gửi" title="Gửi">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <footer id="app-footer"></footer>
</body>
</html>
